# Application du manifeste a la demande, en plan seul par defaut. Une fusion du
# manifeste est appliquee par la reconciliation, pas par ce workflow.
name: appliquer le manifeste

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan seulement, aucune ecriture
        type: boolean
        default: true
      app:
        description: Restreindre a une application (fragment de nom)
        type: string
        default: ""
      force:
        description: Redeployer meme si l'app est deja conforme (exige une app ciblee)
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    # Meme verrou que la reconciliation : jamais deux convergences en parallele.
    concurrency:
      group: scalingo-apply
      cancel-in-progress: false
    steps:
      - uses: incubateur-ademe/scalingo-watcher/actions/apply@417a66c1c4b21ca06ea5310095253e253b0ab138 # v2.0.0
        with:
          dry-run: ${{ inputs.dry_run }}
          app: ${{ inputs.app }}
          force: ${{ inputs.force }}
          # Notification Matrix (Tchap compris), facultative. Le jeton du compte
          # bot va dans le secret MATRIX_ACCESS_TOKEN de l'environment.
          # matrix-homeserver: https://matrix.agent.<domaine>.tchap.gouv.fr
          # matrix-room-id: "!xxxxxxxx:agent.<domaine>.tchap.gouv.fr"
          # Chaque secret est passe, meme vide : l'action ne lit que ce qu'on
          # lui donne, et validate refuse un input requis absent.
          fgp-key: ${{ secrets.FGP_KEY }}
          scalingo-api-token: ${{ secrets.SCALINGO_API_TOKEN }}
          push-token: ${{ secrets.PUSH_TOKEN }}
          teams-webhook: ${{ secrets.TEAMS_WEBHOOK }}
          slack-webhook: ${{ secrets.SLACK_WEBHOOK }}
          matrix-access-token: ${{ secrets.MATRIX_ACCESS_TOKEN }}
