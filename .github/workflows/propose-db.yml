# Proposition des montees de version des bases pilotees, en pull request.
#
# Le cron reste commente jusqu'a la derniere etape de l'installation
# (README.md), comme celui de la reconciliation. Sans PUSH_TOKEN, la pull
# request est ouverte avec le GITHUB_TOKEN et ne declenche pas la validation.
name: proposer les montees de base

on:
  # schedule:
  #   - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    environment: production
    # Pas le verrou de la convergence, que cette proposition ne touche pas. Son
    # propre groupe : deux propositions en parallele se disputeraient la meme
    # branche, poussee en force.
    concurrency:
      group: scalingo-watcher-propose-db
      cancel-in-progress: false
    steps:
      - uses: incubateur-ademe/scalingo-watcher/actions/propose-db@7b22759f100a72d60d0e3ec8d84fd430b9770f9a # v2.0.0
        with:
          fgp-key: ${{ secrets.FGP_KEY }}
          scalingo-api-token: ${{ secrets.SCALINGO_API_TOKEN }}
          push-token: ${{ secrets.PUSH_TOKEN }}
