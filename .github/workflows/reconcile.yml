# Declencheurs, job et verrou de la reconciliation, dont la logique vit dans
# l'action reconcile de scalingo-watcher.
#
# Le push sur le manifeste et le cron restent commentes jusqu'a la derniere
# etape de l'installation (README.md) : une reconciliation deploie, et le
# manifeste doit d'abord decrire le parc reel, dans un ordre relu.
name: reconcilier le parc

on:
  # Fusionner une pull request declenche la convergence tout de suite, au lieu
  # d'attendre le prochain creneau. Le filtre sur le manifeste evite la boucle :
  # le commit de lock que ce workflow produit lui-meme ne le declencherait pas.
  # push:
  #   branches: [main]
  #   paths:
  #     - manifest.yaml
  # Declare a l'heure, execute en pratique toutes les trois a six heures :
  # GitHub ne garantit pas ses crons et saute des creneaux. Un passage a vide
  # coute moins d'une minute.
  # schedule:
  #   - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Relever et comparer sans rien deployer
        type: boolean
        default: false
      # Pose a true par le relais du deploiement asynchrone. Sans cet input
      # declare, GitHub refuse son dispatch.
      resume:
        description: Faire avancer le deploiement en cours sans en ouvrir un (relais)
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # Les secrets d'acces vivent dans cet environment, reserve a main par sa
    # politique de branches.
    environment: production
    # Jamais deux convergences en parallele, et jamais annuler celle en cours :
    # elle peut etre au milieu d'une sauvegarde ou d'un deploiement. Meme groupe
    # que l'application, au seul niveau du job : declare aussi au niveau du
    # workflow, il ferait annuler le run par GitHub pour interblocage. L'action
    # validate refuse un appel qui s'en ecarte.
    concurrency:
      group: scalingo-apply
      cancel-in-progress: false
      # Par defaut, GitHub ne garde qu'un passage en attente et annule le
      # precedent : une reprise annulerait un passage ordinaire, seul a pouvoir
      # ouvrir un deploiement. Tous attendent donc leur tour.
      queue: max
    steps:
      - uses: incubateur-ademe/scalingo-watcher/actions/reconcile@7b22759f100a72d60d0e3ec8d84fd430b9770f9a # v2.0.0
        with:
          # Le cron et le push n'ont pas d'inputs : la comparaison ramene leur
          # valeur absente a "false".
          dry-run: ${{ inputs.dry_run == true }}
          resume: ${{ inputs.resume == true }}
          # Deploiement asynchrone, a n'activer qu'avec un relais en place
          # (FEATURES de l'outil, « Relais et notifiers »). Sans relais, le cron
          # seul ferait durer un deploiement des heures.
          # async: "true"
          # Notification Matrix (Tchap compris), facultative. Le jeton du compte
          # bot va dans le secret MATRIX_ACCESS_TOKEN de l'environment.
          # matrix-homeserver: https://matrix.agent.<domaine>.tchap.gouv.fr
          # matrix-room-id: "!xxxxxxxx:agent.<domaine>.tchap.gouv.fr"
          # Chaque secret est passe, meme vide : l'action ne lit que ce qu'on
          # lui donne, et validate refuse un input requis absent.
          fgp-key: ${{ secrets.FGP_KEY }}
          scalingo-api-token: ${{ secrets.SCALINGO_API_TOKEN }}
          push-token: ${{ secrets.PUSH_TOKEN }}
          teams-webhook: ${{ secrets.TEAMS_WEBHOOK }}
          slack-webhook: ${{ secrets.SLACK_WEBHOOK }}
          matrix-access-token: ${{ secrets.MATRIX_ACCESS_TOKEN }}
          # Veille de silence, facultative : URL du service dans le secret
          # HEARTBEAT_URL de l'environment (README, etape 6).
          heartbeat-url: ${{ secrets.HEARTBEAT_URL }}
