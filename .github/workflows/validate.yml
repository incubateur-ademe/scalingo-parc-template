# Validation du manifeste, controle des appels de l'outil et plan publie en
# commentaire de pull request. Aucun secret : ce workflow tourne sur les pull
# requests.
name: valider le manifeste

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: incubateur-ademe/scalingo-watcher/actions/validate@7b22759f100a72d60d0e3ec8d84fd430b9770f9a # v2.0.0
