# Validation du manifeste et plan publie en commentaire de pull request. Aucun
# secret : ce workflow tourne sur les pull requests.
name: valider le manifeste

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: incubateur-ademe/scalingo-watcher/.github/workflows/validate.yml@413dbe0792bd3552a888865b3b745012ef8ea665 # v1.4.0
