# Validation du manifeste, controle des appels de l'outil et plan publie en
# commentaire de pull request. Aucun secret : ce workflow tourne sur les pull
# requests.
name: valider le manifeste

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: incubateur-ademe/scalingo-watcher/actions/validate@65050c37b2cfed3fb496ae6211e673b7b7ec88f4 # v2.0.0
