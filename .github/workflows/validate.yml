# Validation du manifeste et plan publie en commentaire de pull request. Aucun
# secret : ce workflow tourne sur les pull requests.
name: valider le manifeste

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: incubateur-ademe/scalingo-watcher/.github/workflows/validate.yml@b512a32eaa85d5e4c300abfea700d145494aa053 # v1.1.2
