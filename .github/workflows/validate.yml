# Validation du manifeste et plan publie en commentaire de pull request. Aucun
# secret : ce workflow tourne sur les pull requests.
name: valider le manifeste

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: incubateur-ademe/scalingo-watcher/.github/workflows/validate.yml@054eb27cb01b940bbcda4900c6fa51e8cbf61222 # v1.0.5
